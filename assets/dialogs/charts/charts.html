<!DOCTYPE html>
<html>
    <head>
        <title>chart</title>
        <meta chartset="utf-8">
        <link rel="stylesheet" type="text/css" href="charts.css">
        <script type="text/javascript" src="../internal.js"></script>
    </head>
    <body>
        <div class="main">
            <div class="table-view">
                <h3><var id="lang_data_source"></var></h3>
                <div id="tableContainer" class="table-container"></div>
                <h3><var id="lang_chart_format"></var></h3>
                <form name="data-form">
                    <div class="charts-format">
                        <fieldset>
                            <legend><var id="lang_data_align"></var></legend>
                            <div class="format-item-container">
                                <label>
                                    <input type="radio" class="format-ctrl not-pie-item" name="charts-format" value="1" checked="checked">
                                    <var id="lang_chart_align_same"></var>
                                </label>
                                <label>
                                    <input type="radio" class="format-ctrl not-pie-item" name="charts-format" value="-1">
                                    <var id="lang_chart_align_reverse"></var>
                                </label>
                                <br>
                            </div>
                        </fieldset>
                        <fieldset>
                            <legend><var id="lang_chart_title"></var></legend>
                            <div class="format-item-container">
                                <label>
                                    <var id="lang_chart_main_title"></var><input type="text" name="title" class="data-item">
                                </label>
                                <label>
                                    <var id="lang_chart_sub_title"></var><input type="text" name="sub-title" class="data-item not-pie-item">
                                </label>
                                <label>
                                    <var id="lang_chart_x_title"></var><input type="text" name="x-title" class="data-item not-pie-item">
                                </label>
                                <label>
                                    <var id="lang_chart_y_title"></var><input type="text" name="y-title" class="data-item not-pie-item">
                                </label>
                            </div>
                        </fieldset>
                        <fieldset>
                            <legend><var id="lang_chart_tip"></var></legend>
                            <div class="format-item-container">
                                <label>
                                    <var id="lang_cahrt_tip_prefix"></var>
                                    <input type="text" id="tipInput" name="tip" class="data-item" disabled="disabled">
                                </label>
                                <p><var id="lang_cahrt_tip_description"></var></p>
                            </div>
                        </fieldset>
                        <fieldset>
                            <legend><var id="lang_chart_data_unit"></var></legend>
                            <div class="format-item-container">
                                <label><var id="lang_chart_data_unit_title"></var><input type="text" name="unit" class="data-item"></label>
                                <p><var id="lang_chart_data_unit_description"></var></p>
                            </div>
                        </fieldset>
                    </div>
                </form>
            </div>
            <div class="charts-view">
                <div id="chartsContainer" class="charts-container"></div>
                <div id="chartsType" class="charts-type">
                    <h3><var id="lang_chart_type"></var></h3>
                    <div class="scroll-view">
                        <div class="scroll-container">
                            <div id="scrollBed" class="scroll-bed"></div>
                        </div>
                        <div id="buttonContainer" class="button-container">
                            <a href="#" data-title="prev"><var id="lang_prev_btn"></var></a>
                            <a href="#" data-title="next"><var id="lang_next_btn"></var></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="../../third-party/jquery-3.7.1.min.js"></script>
        <script src="chart.config.js"></script>
        <!--
            ECharts 的加载方式由编辑器配置 chartEchartsMode 决定（默认 local）：
              local  加载扩展自带的 echarts.common.min.js，离线可用
              reuse  复用宿主页面已加载的 window.echarts
              其它值  视为 URL，从该 CDN/自定义地址加载
            三种模式地址不同、且 reuse 不应发起请求，故不能用静态 <script src>。
            echarts 只需在 window.onload（charts.js 的入口）之前就绪，这里同步完成，
            再加载 charts.js。
        -->
        <script>
            (function () {
                var mode = ( window.editor && editor.options.chartEchartsMode ) || 'local';

                if ( mode === 'reuse' ) {
                    //复用宿主页面的 echarts 全局（实例仍绑定本窗口自己的 DOM 容器）。
                    //跨域时访问 parent.echarts 会抛错，退回 local。
                    if ( !window.echarts ) {
                        try {
                            window.echarts = window.parent && window.parent.echarts;
                        } catch ( e ) {
                            window.echarts = null;
                        }
                    }
                    if ( window.echarts ) {
                        return;
                    }
                    mode = 'local';
                }

                var src = ( mode === 'local' )
                    ? '../../third-party/echarts/echarts.common.min.js'
                    : mode;

                document.write( '<script src="' + src + '"><\/script>' );
            })();
        </script>
        <script src="charts.js"></script>
    </body>
</html>
